{% extends "base.html" %}
{% block title %}Sign in · ShopNode Service Desk{% endblock %}
{% block content %}
<section class="panel" style="max-width: 480px; margin: 45px auto;">
  <h2>Service Desk Sign In</h2>
  <p class="muted">Use the local sandbox bot account configured in the environment.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label for="username">User name</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="submit" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
